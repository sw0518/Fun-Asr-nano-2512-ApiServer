version: '3.8'

services:
  fun-asr-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: fun-asr-api:latest
    container_name: fun-asr-api
    ports:
      - "8800:8000"
    volumes:
      - /media/saixunda/DataDisk/xiaozhi-server/funasr_models:/models
    # environment:
    #   - MODELS={"fun-asr-nano-2512": "/models/Fun-ASR-MLT-Nano-2512"}
    #   - DEVICE=cuda:0
    #   - MAX_CONCURRENT_REQUESTS=10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always
